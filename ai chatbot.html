<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple AI</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.chat {
    width: 350px;
    height: 500px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.header {
    background: #2563eb;
    color: white;
    padding: 18px;
    font-size: 20px;
    font-weight: bold;
}

.messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
}

.message {
    margin: 10px 0;
    padding: 10px;
    border-radius: 10px;
    max-width: 80%;
}

.user {
    background: #2563eb;
    color: white;
    margin-left: auto;
}

.ai {
    background: #e5e7eb;
    color: black;
}

.input-area {
    display: flex;
    padding: 10px;
    border-top: 1px solid #ddd;
}

input {
    flex: 1;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
}

button {
    margin-left: 8px;
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="chat">
    <div class="header">Simple AI</div>
    <div class="messages" id="messages">
        <div class="message ai">Hello! How can I help you?</div>
    </div>
    <div class="input-area">
        <input id="input" type="text" placeholder="Ask something..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
function sendMessage() {
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
    const text = input.value.trim();

    if (!text) return;

    messages.innerHTML += `<div class="message user">${text}</div>`;
    input.value = "";

    setTimeout(() => {
        let reply = "I am a simple AI. I can answer basic questions.";

        const question = text.toLowerCase();

        if (question.includes("hello") || question.includes("hi")) {
            reply = "Hello! Nice to meet you.";
        } else if (question.includes("your name")) {
            reply = "My name is Simple AI.";
        } else if (question.includes("how are you")) {
            reply = "I'm doing great!";
        } else if (question.includes("bye")) {
            reply = "Goodbye! Have a great day.";
        }

        messages.innerHTML += `<div class="message ai">${reply}</div>`;
        messages.scrollTop = messages.scrollHeight;
    }, 500);
}
</script>

</body>
</html>
